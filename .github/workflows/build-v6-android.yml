name: Build Controller Bridge V6 - Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v6-android.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes the Android SDK.
      # We deliberately do not use android-actions/setup-android here,
      # because that step is what failed in the previous run.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ControllerBridgeV6.apk

      - name: Upload V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: ControllerBridge-V6-APK
          path: output/ControllerBridgeV6.apk
